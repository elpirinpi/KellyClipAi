name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.0"

      - name: Check version consistency
        run: python scripts/check_version.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up verified FFmpeg for media tests
        shell: pwsh
        run: |
          $version = "9.0.2"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-essentials_build.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba") {
            throw "The FFmpeg archive SHA-256 did not match: $actualHash"
          }
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination "ffmpeg-$version-essentials_build\bin"
          foreach ($binary in @("ffmpeg.exe", "ffprobe.exe")) {
            if (-not (Test-Path (Join-Path $bin $binary))) { throw "FFmpeg archive is missing $binary." }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "ffmpeg.exe") -version | Select-Object -First 1

      - name: Install Python dependencies and audit tools
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Check Python lock files are up to date
        # pip-tools 7.5.2 has no --check flag: regenerate each lock with
        # --dry-run (which prints to stderr, followed by a "Dry-run, so
        # nothing updated." trailer) and compare it with the committed
        # file. The flags must match the header recorded in each lock
        # (--allow-unsafe --generate-hashes); any extra flag would change
        # the header and fail the comparison. --dry-run itself is not
        # recorded in the header. If this step fails, regenerate the lock
        # on Windows with the command from README.md.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pair in @(
            @{ Input = 'requirements.txt'; Lock = 'requirements.lock' },
            @{ Input = 'requirements-dev.txt'; Lock = 'requirements-dev.lock' },
            @{ Input = 'requirements-desktop.txt'; Lock = 'requirements-desktop.lock' }
          )) {
            $stderrFile = Join-Path $env:RUNNER_TEMP "pip-compile-$($pair.Lock).txt"
            & pip-compile --allow-unsafe --generate-hashes --dry-run --output-file=$($pair.Lock) $($pair.Input) 2> $stderrFile
            if ($LASTEXITCODE -ne 0) { throw "pip-compile failed for $($pair.Input)." }
            $lines = @(Get-Content $stderrFile)
            $start = 0
            while ($start -lt $lines.Count -and -not $lines[$start].StartsWith('#')) { $start++ }
            if ($start -ge $lines.Count) { throw "pip-compile produced no lock output for $($pair.Input)." }
            $generated = (($lines[$start..($lines.Count - 1)] | Where-Object { $_ -ne 'Dry-run, so nothing updated.' }) -join "`n").TrimEnd()
            $committed = ((Get-Content $pair.Lock -Raw) -replace "`r`n", "`n").TrimEnd()
            if ($generated -ne $committed) {
              throw "Lock file $($pair.Lock) is out of date with $($pair.Input). Regenerate it with: pip-compile --generate-hashes --allow-unsafe --output-file=$($pair.Lock) $($pair.Input)"
            }
          }

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Run backend tests
        run: python -m pytest

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        # Advisory until the tree is formatted once (28 of 38 files fail
        # today, 19-11-2026): visible in CI, but does not block while the
        # reformat is pending. Remove continue-on-error after running
        # `ruff format` on the whole tree.
        continue-on-error: true
        run: ruff format --check .

      - name: Type-check frontend
        working-directory: app
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build --prefix app

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock
          pip-audit -r requirements-desktop.lock

      - name: Audit frontend dependencies
        run: npm audit --prefix app --audit-level=high
