name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build installer
        shell: pwsh
        run: .\build_windows.ps1

      - name: Attach installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Get-Content .\app\package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_EVENT_NAME -eq "release") { $env:GITHUB_REF_NAME } else { $env:RELEASE_TAG }
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match app version v$version."
          }
          gh release upload $tag ".\artifacts\KellyClipAi-Setup-$version.exe" --repo $env:GITHUB_REPOSITORY --clobber
