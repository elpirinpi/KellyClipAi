name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  wait-for-ci:
    name: Wait for CI on the release commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for the CI workflow to succeed on this commit
        # GitHub Actions has no cross-workflow `needs:`, so the release
        # gate is implemented by polling the Checks API for the CI job
        # ("quality") on the commit this release will build from. The
        # release job below needs this job, so a release can never be
        # published while CI is failing (or has not run) on that commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object')
            obj_type=$(echo "$tag_ref" | jq -r '.type')
            sha=$(echo "$tag_ref" | jq -r '.sha')
            if [ "$obj_type" = "tag" ]; then
              # Annotated tag: peel it to the commit it points to.
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')
            fi
          else
            sha="$GITHUB_SHA"
          fi
          echo "Waiting for CI (job 'quality') on commit $sha"
          deadline=$((SECONDS + 1800))
          while [ $SECONDS -lt $deadline ]; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "quality")] | sort_by(.started_at) | last | "\(.status)/\(.conclusion)"')
            case "$result" in
              completed/success)
                echo "CI passed on $sha."
                exit 0
                ;;
              completed/*)
                echo "CI did not succeed on $sha (status: $result); refusing to release."
                exit 1
                ;;
              *)
                echo "CI status on $sha: ${result:-not started yet}; waiting..."
                sleep 30
                ;;
            esac
          done
          echo "Timed out waiting for CI on $sha."
          exit 1

  build-installer:
    needs: [wait-for-ci]
    runs-on: windows-2022
    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # On workflow_dispatch, build the code of the requested tag,
          # not of the default branch; on release events github.ref is
          # already the published tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.0"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up verified FFmpeg for media tests
        shell: pwsh
        run: |
          $version = "9.0.2"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-$version-essentials_build.zip"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$version-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba") {
            throw "The FFmpeg archive SHA-256 did not match: $actualHash"
          }
          $destination = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination "ffmpeg-$version-essentials_build\bin"
          foreach ($binary in @("ffmpeg.exe", "ffprobe.exe")) {
            if (-not (Test-Path (Join-Path $bin $binary))) { throw "FFmpeg archive is missing $binary." }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "ffmpeg.exe") -version | Select-Object -First 1

      - name: Install Python test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest

      - name: Build installer
        shell: pwsh
        env:
          # Optional code signing (see README.md, "Firma de código"):
          # secrets that do not exist evaluate to empty strings, and the
          # build then continues unsigned, without failing.
          KELLYCLIP_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          KELLYCLIP_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          KELLYCLIP_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
          KELLYCLIP_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          KELLYCLIP_AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          KELLYCLIP_AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
        run: .\build_windows.ps1

      - name: Smoke-test built bundle
        # El bundle es un ejecutable --windowed: PowerShell no esperaría a que
        # terminase con `&`, por eso se usa Start-Process -Wait -PassThru.
        # Si el smoke test falla, este paso falla y el instalador NO se publica.
        # El smoke test arranca el backend local en el puerto 8000 y comprueba
        # /, /settings, /api/health y que ffmpeg/ffprobe se ejecuten
        # (desktop.py, KELLYCLIP_SMOKE_TEST=1). El timeout acota el paso si un
        # fallo de arranque deja abierto el cuadro de error de Windows.
        shell: pwsh
        env:
          KELLYCLIP_SMOKE_TEST: "1"
        timeout-minutes: 10
        run: |
          $bundleExe = ".\build\bundle\KellyClipAi\KellyClipAi.exe"
          if (-not (Test-Path $bundleExe)) { throw "Built bundle not found: $bundleExe" }
          $process = Start-Process -FilePath $bundleExe -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA "kellyClipAi\desktop.log"
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw "Smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Attach installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Get-Content .\app\package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_EVENT_NAME -eq "release") { $env:GITHUB_REF_NAME } else { $env:RELEASE_TAG }
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match app version v$version."
          }
          gh release upload $tag ".\artifacts\KellyClipAi-Setup-$version.exe" --repo $env:GITHUB_REPOSITORY --clobber
